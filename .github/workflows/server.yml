name: Bot & sync server

on:
  push:
    paths: ["src/**", "addon/**", "assets/**", "package.json", "bun.lock", "tsconfig.json", "Dockerfile", ".github/workflows/server.yml"]
  pull_request:
    paths: ["src/**", "addon/**", "assets/**", "package.json", "bun.lock", "tsconfig.json", "Dockerfile", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: sudo apt-get install -y luajit # lets the sync tests run the real addon
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wow-forever-discord-bot:latest
            ghcr.io/${{ github.repository_owner }}/wow-forever-discord-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
