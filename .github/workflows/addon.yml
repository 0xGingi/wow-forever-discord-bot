name: Addon

on:
  push:
    paths: ["addon/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["addon/**", ".github/workflows/addon.yml"]
  workflow_dispatch:

permissions:
  contents: write # publish to the rolling "latest" release

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the addon against a fake WoW API
        run: |
          sudo apt-get install -y luajit
          luajit addon/test/harness.lua addon/UwucrewSync "$RUNNER_TEMP/UwucrewSync.lua"
      - name: Package
        run: mkdir -p dist && cd addon && zip -qr ../dist/UwucrewSync.zip UwucrewSync
      - uses: actions/upload-artifact@v4
        with:
          name: UwucrewSync
          path: dist/UwucrewSync.zip
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes-file .github/release-notes.md || true
          gh release upload latest dist/UwucrewSync.zip --clobber
